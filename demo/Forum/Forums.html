<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Neo — Форумы</title>
    <!-- Тема: класс .dark ставим до первой отрисовки, чтобы не мигало -->
    <script>try {const t = localStorage.getItem('neo-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');document.documentElement.classList.toggle('dark', t === 'dark');} catch (e) {}</script>
    <!-- Конфиг Quas (до quas.js). Важно: именно window.Quas, а не window.Q -->
    <script>window.Quas = {AutoDarkMode: false, CSSTagMode: false, CSSPerformance: false};</script>
    <script src="https://cdn.jsdelivr.net/gh/wemmbley/quas@master/Source/Quas.js"></script>
    <script src="https://unpkg.com/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/wemmbley/wex-js@master/dist/wex.min.js"></script>
    <style>
        :root {
            color-scheme: light;
            --color-base-100: #ffffff;
            --color-base-200: #f5f5f5;
            --color-base-300: #e5e5e5;
            --color-base-content: #0a0a0a;
            --color-primary: #171717;
            --color-primary-content: #fafafa;
        }
        .dark {
            color-scheme: dark;
            --color-base-100: #0a0a0a;
            --color-base-200: #1f1f1f;
            --color-base-300: #262626;
            --color-base-content: #fafafa;
            --color-primary: #fafafa;
            --color-primary-content: #171717;
        }
        *, ::before, ::after {
            border-color: var(--color-base-300);
        }
    </style>
</head>
<body>
    <template id="app" attrs="{ class: 'min-h-screen bg-base-100 text-base-content antialiased' }">
        <header class="sticky top-0 z-40 border-b bg-base-100/85 backdrop-blur">
            <div class="mx-auto flex h-14 w-full max-w-6xl items-center gap-4 px-4 md:gap-6 md:px-6">
                <a href="#" class="text-lg font-semibold tracking-tight">Neo</a>
                <nav class="flex items-center gap-1" aria-label="Основная навигация">
                    <a href="forum.html" class="rounded-md bg-base-200 px-3 py-1.5 text-sm font-medium">Форумы</a>
                </nav>
                <div class="ml-auto flex items-center gap-2">
                    <div class="relative">
                        <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-base-content/60"
                             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                             stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="m21 21-4.3-4.3"/>
                        </svg>
                        <input id="searchbox" type="search" w-bind="query" placeholder="Поиск" aria-label="Поиск"
                               class="h-9 w-28 rounded-md border pl-9 pr-3 text-sm outline-none transition-colors focus-visible:ring-2 focus-visible:ring-base-content/30 sm:w-56">
                    </div>
                    <a href="#login"
                       class="hidden h-9 items-center rounded-md px-3 text-sm font-medium transition-colors hover:bg-base-200 md:inline-flex">Вход</a>
                    <a href="#register"
                       class="hidden h-9 items-center rounded-md bg-primary px-3 text-sm font-medium text-primary-content transition-opacity hover:opacity-90 md:inline-flex">Регистрация</a>
                    <button type="button" w-on="click:toggleTheme" aria-label="Переключить тему"
                            class="inline-flex h-9 w-9 cursor-pointer items-center justify-center rounded-md border transition-colors hover:bg-base-200 focus-visible:ring-2 focus-visible:ring-base-content/30">
                        <svg w-if="dark" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="4"/>
                            <path d="M12 2v2"/>
                            <path d="M12 20v2"/>
                            <path d="m4.93 4.93 1.41 1.41"/>
                            <path d="m17.66 17.66 1.41 1.41"/>
                            <path d="M2 12h2"/>
                            <path d="M20 12h2"/>
                            <path d="m6.34 17.66-1.41 1.41"/>
                            <path d="m19.07 4.93-1.41 1.41"/>
                        </svg>
                        <svg w-if="!dark" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </header>
        <main class="mx-auto w-full max-w-6xl px-4 py-6 md:px-6 md:py-10">
            <div w-if="!loaded && !error" class="py-24 text-center text-sm text-base-content/60">Загрузка…</div>
            <div w-if="error" class="py-24 text-center text-sm text-base-content/60">Не удалось загрузить forum.json.
                Откройте страницу через сервер, а не через file://.
            </div>
            <div w-if="loaded" class="grid grid-cols-1 items-start gap-6 md:grid-cols-[minmax(0,1fr)_17rem]">
                <div class="grid gap-6">
                    <!-- Последние темы -->
                    <section class="rounded-xl border shadow-sm">
                        <div class="flex items-center justify-between px-5 pt-5">
                            <h1 class="text-sm font-semibold tracking-tight">Последние темы</h1>
                            <a href="topic.html"
                               class="text-xs text-base-content/60 transition-colors hover:text-base-content">Все темы</a>
                        </div>
                        <div class="mt-3 divide-y px-5 pb-2">
                            <div w-for="t in data.topics traceby t.id"
                                 class="flex flex-wrap items-center gap-x-3 gap-y-1 py-3">
                                <span class="inline-flex shrink-0 items-center rounded-md bg-base-200 px-2 py-0.5 text-xs font-medium text-base-content/60">{{ t.badge }}</span>
                                <div class="min-w-0 flex-1">
                                    <a href="{{ t.href }}" class="text-sm font-medium hover:underline">{{ t.title }}</a>
                                    <span w-if="!!t.note" class="text-sm text-base-content/60"> ({{ t.note }})</span>
                                    <div class="mt-1 text-xs text-base-content/60">{{ t.category }} · {{ t.meta }}</div>
                                </div>
                            </div>
                        </div>
                    </section>
                    <!-- Мой форум номер один -->
                    <section class="rounded-xl border shadow-sm">
                        <div class="flex items-center justify-between px-5 pt-5">
                            <h2 class="text-sm font-semibold tracking-tight">Мой форум номер один</h2>
                            <button type="button"
                                    class="inline-flex h-8 cursor-pointer items-center rounded-md border px-3 text-xs font-medium transition-colors hover:bg-base-200">
                                Все разделы
                            </button>
                        </div>
                        <div class="mt-4 hidden grid-cols-2 gap-4 border-t px-5 py-2 text-xs font-medium text-base-content/60 md:grid">
                            <span>Форум</span>
                            <span>Последнее сообщение</span>
                        </div>
                        <div class="divide-y border-t">
                            <div w-for="f in data.forums traceby f.id"
                                 class="grid items-center gap-4 px-5 py-4 md:grid-cols-2">
                                <div class="flex items-center gap-3">
                                    <div class="grid h-10 w-10 shrink-0 place-items-center rounded-lg border bg-base-200 text-sm font-semibold text-base-content/60">
                                        {{ f.icon }}
                                    </div>
                                    <div class="min-w-0">
                                        <a href="{{ f.href }}" class="text-sm font-semibold hover:underline">{{ f.title }}</a>
                                        <div class="mt-1 text-xs text-base-content/60">{{ f.desc }}</div>
                                        <div class="mt-2 text-xs text-base-content/60">{{ f.tags }}</div>
                                    </div>
                                </div>
                                <div class="hidden text-xs leading-relaxed text-base-content/60 md:block">
                                    <div><span class="font-medium text-base-content">Тема:</span> {{ f.lastTopic }}</div>
                                    <div><span class="font-medium text-base-content">Сообщение:</span> {{ f.lastBy }} {{ f.lastTime }}</div>
                                </div>
                            </div>
                        </div>
                    </section>
                    <!-- Разделы форума -->
                    <section class="rounded-xl border p-5 shadow-sm">
                        <h2 class="mb-4 text-sm font-semibold tracking-tight">Разделы форума</h2>
                        <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
                            <a w-for="s in data.sections traceby s.id" href="{{ s.href }}"
                               class="flex items-start gap-3 rounded-lg border p-4 transition-colors hover:bg-base-200">
                                <div class="grid h-10 w-10 shrink-0 place-items-center rounded-lg border bg-base-200 text-sm font-semibold text-base-content/60">
                                    {{ s.icon }}
                                </div>
                                <div class="min-w-0">
                                    <div class="text-sm font-medium">{{ s.name }}</div>
                                    <div class="mt-1 text-xs text-base-content/60">
                                        Темы: {{ s.topics }} · Сообщения: {{ s.posts }}
                                    </div>
                                    <div class="mt-2 text-xs text-base-content/60">▾ Подфорумы</div>
                                </div>
                                <span class="ml-auto text-xs tabular-nums text-base-content/60">{{ s.topics }}</span>
                            </a>
                        </div>
                    </section>
                </div>
                <!-- Профиль (на мобильных уезжает наверх) -->
                <aside class="order-first rounded-xl border p-5 shadow-sm md:order-none">
                    <h2 class="mb-4 text-sm font-semibold tracking-tight">Профиль</h2>
                    <div class="flex items-center gap-3">
                        <div class="h-12 w-12 shrink-0 rounded-full border bg-base-200" aria-hidden="true"></div>
                        <div class="min-w-0">
                            <div class="text-sm font-semibold">{{ data.profile.name }}</div>
                            <div class="mt-1 text-xs leading-relaxed text-base-content/60">
                                Сообщения: {{ data.profile.messages }}<br>Репутация: {{ data.profile.reputation }}
                            </div>
                        </div>
                    </div>
                    <div class="mt-4 hidden border-t pt-4 text-xs md:block">
                        <div class="flex items-center justify-between py-1">
                            <span class="text-base-content/60">Группа</span>
                            <span class="inline-flex items-center rounded-md bg-primary px-2 py-0.5 font-medium text-primary-content">{{ data.profile.group }}</span>
                        </div>
                        <div class="flex items-center justify-between py-1">
                            <span class="text-base-content/60">Срок действия</span>
                            <span class="font-medium">{{ data.profile.expires }}</span>
                        </div>
                        <div class="flex items-center justify-between py-1">
                            <span class="text-base-content/60">Лайков на сегодня</span>
                            <span class="font-medium tabular-nums">{{ data.profile.likesToday }}</span>
                        </div>
                    </div>
                    <div class="mt-4 hidden items-center justify-between border-t pt-4 text-xs md:flex">
                        <span class="text-base-content/60">Участников</span>
                        <span class="font-semibold tabular-nums">{{ data.profile.members }}</span>
                    </div>
                </aside>
            </div>
        </main>
    </template>
</body>
<footer>
    <script>
        $('#app')
            .state({
                dark: document.documentElement.classList.contains('dark'),
                loaded: false,
                error: false,
                query: '',
                data: {
                    profile: {},
                    topics: [],
                    forums: [],
                    sections: []
                }
            })
            .method('toggleTheme', function (state) {
                state.dark = !state.dark;
                document.documentElement.classList.toggle('dark', state.dark);
                try { localStorage.setItem('neo-theme', state.dark ? 'dark' : 'light');} catch (e) {}
            })
            .on('$mount', function (state) {
                $wire.get('forum.json').to(state.data)
                    .done(function () { state.loaded = true; })
                    .fail(function () { state.error = true; });
            })
            .mount();
    </script>
</footer>
</html>
