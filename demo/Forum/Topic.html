<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Neo — Правила форума</title>
    <script>try { const t = localStorage.getItem('neo-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');document.documentElement.classList.toggle('dark', t === 'dark');} catch (e) {}</script>
    <!-- Конфиг Quas (до quas.js). Важно: именно window.Quas, а не window.Q -->
    <script>window.Quas = {AutoDarkMode: false, CSSTagMode: false, CSSPerformance: false};</script>
    <script src="https://cdn.jsdelivr.net/gh/wemmbley/quas@master/Source/Quas.js"></script>
    <script src="https://unpkg.com/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/wemmbley/wex-js@master/dist/wex.min.js"></script>
    <style>
        :root {
            color-scheme: light;
            --color-base-100: #ffffff;
            --color-base-200: #f5f5f5;
            --color-base-300: #e5e5e5;
            --color-base-content: #0a0a0a;
            --color-primary: #171717;
            --color-primary-content: #fafafa;
        }
        .dark {
            color-scheme: dark;
            --color-base-100: #0a0a0a;
            --color-base-200: #1f1f1f;
            --color-base-300: #262626;
            --color-base-content: #fafafa;
            --color-primary: #fafafa;
            --color-primary-content: #171717;
        }
        *, ::before, ::after {
            border-color: var(--color-base-300);
        }
    </style>
</head>
<body>
    <template id="app" attrs="{ class: 'min-h-screen bg-base-100 text-base-content antialiased' }">
        <header class="sticky top-0 z-40 border-b bg-base-100/85 backdrop-blur">
            <div class="mx-auto flex h-14 w-full max-w-6xl items-center gap-4 px-4 md:gap-6 md:px-6">
                <a href="forum.html" class="text-lg font-semibold tracking-tight">Neo</a>
                <nav class="flex items-center gap-1" aria-label="Основная навигация">
                    <a href="forum.html" class="rounded-md bg-base-200 px-3 py-1.5 text-sm font-medium">Форумы</a>
                </nav>
                <div class="ml-auto flex items-center gap-2">
                    <div class="relative">
                        <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-base-content/60"
                             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                             stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="m21 21-4.3-4.3"/>
                        </svg>
                        <input id="searchbox" type="search" w-bind="query" placeholder="Поиск" aria-label="Поиск"
                               class="h-9 w-28 rounded-md border pl-9 pr-3 text-sm outline-none transition-colors focus-visible:ring-2 focus-visible:ring-base-content/30 sm:w-56">
                    </div>
                    <a href="#login"
                       class="hidden h-9 items-center rounded-md px-3 text-sm font-medium transition-colors hover:bg-base-200 md:inline-flex">Вход</a>
                    <a href="#register"
                       class="hidden h-9 items-center rounded-md bg-primary px-3 text-sm font-medium text-primary-content transition-opacity hover:opacity-90 md:inline-flex">Регистрация</a>
                    <button type="button" w-on="click:toggleTheme" aria-label="Переключить тему"
                            class="inline-flex h-9 w-9 cursor-pointer items-center justify-center rounded-md border transition-colors hover:bg-base-200 focus-visible:ring-2 focus-visible:ring-base-content/30">
                        <svg w-if="dark" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="4"/>
                            <path d="M12 2v2"/>
                            <path d="M12 20v2"/>
                            <path d="m4.93 4.93 1.41 1.41"/>
                            <path d="m17.66 17.66 1.41 1.41"/>
                            <path d="M2 12h2"/>
                            <path d="M20 12h2"/>
                            <path d="m6.34 17.66-1.41 1.41"/>
                            <path d="m19.07 4.93-1.41 1.41"/>
                        </svg>
                        <svg w-if="!dark" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </header>
        <main class="mx-auto w-full max-w-6xl px-4 py-6 md:px-6 md:py-10">
            <div w-if="!loaded && !error" class="text-center text-sm text-base-content/60">Загрузка…</div>
            <div w-if="error" class="py-24 text-center text-sm text-base-content/60">Не удалось загрузить topic.json.
                Откройте страницу через сервер, а не через file://.
            </div>
            <div w-if="loaded">
                <!-- Хлебные крошки -->
                <nav class="mb-4 flex items-center gap-2 text-xs text-base-content/60" aria-label="Хлебные крошки">
                    <a href="forum.html" class="transition-colors hover:text-base-content">Главная</a>
                    <span>/</span>
                    <a href="forum.html" class="transition-colors hover:text-base-content">Форум</a>
                    <span>/</span>
                    <span class="font-medium text-base-content">{{ data.topic.title }}</span>
                </nav>
                <!-- Заголовок темы -->
                <div class="mb-5 flex items-center justify-between gap-4 md:items-end">
                    <div class="min-w-0">
                        <h1 class="text-xl font-semibold tracking-tight md:text-2xl">{{ data.topic.title }}</h1>
                        <div class="mt-1 text-xs text-base-content/60">{{ data.topic.category }} · {{
                            data.topic.repliesLabel }}
                        </div>
                    </div>
                    <button type="button" w-on="click:focusReply"
                            class="inline-flex h-9 shrink-0 cursor-pointer items-center whitespace-nowrap rounded-md bg-primary px-4 text-sm font-medium text-primary-content transition-opacity hover:opacity-90 focus-visible:ring-2 focus-visible:ring-base-content/30">
                        Ответить
                    </button>
                </div>
                <!-- Страницы -->
                <div class="mb-3 flex items-center gap-1.5" aria-label="Страницы темы">
                    <button w-for="p in data.topic.pages" type="button" w-on="click:setPage(p)"
                            w-class="{ 'bg-primary text-primary-content border-transparent': page === p, 'hover:bg-base-200': page !== p }"
                            class="inline-flex h-8 min-w-8 cursor-pointer items-center justify-center rounded-md border px-2 text-xs font-medium transition-colors">
                        {{ p }}
                    </button>
                    <span class="ml-auto text-xs text-base-content/60">{{ data.topic.updated }}</span>
                </div>
                <!-- Посты: автор слева, текст справа; на мобильном склеены в одну карточку -->
                <div class="grid gap-3">
                    <article w-for="post in data.posts traceby post.id"
                             class="grid grid-cols-1 md:grid-cols-[12rem_minmax(0,1fr)] md:gap-3">
                        <aside class="rounded-t-xl border p-4 shadow-sm md:min-h-40 md:rounded-xl">
                            <div class="flex items-center gap-3">
                                <div class="h-10 w-10 shrink-0 rounded-full border bg-base-200 md:h-12 md:w-12"
                                     aria-hidden="true"></div>
                                <div class="min-w-0">
                                    <div class="text-sm font-semibold">{{ post.author.name }}</div>
                                    <div class="mt-0.5 text-xs leading-relaxed text-base-content/60">
                                        Сообщения: {{ post.author.messages }}<br>Репутация: {{ post.author.reputation }}
                                    </div>
                                </div>
                            </div>
                            <div class="mt-4 hidden md:block">
                                <span class="inline-flex items-center rounded-md bg-base-200 px-2 py-0.5 text-xs font-medium text-base-content/60">{{ post.author.role }}</span>
                            </div>
                        </aside>
                        <div class="-mt-px rounded-b-xl border p-4 shadow-sm md:mt-0 md:min-h-40 md:rounded-xl md:p-5">
                            <div class="mb-3 flex items-center justify-between gap-3">
                                <strong class="text-sm font-semibold">{{ post.title }}</strong>
                                <time class="shrink-0 text-xs text-base-content/60">{{ post.date }}</time>
                            </div>
                            <div class="grid gap-3 text-sm leading-7">
                                <p w-for="para in post.paragraphs">{{ para }}</p>
                            </div>
                            <div class="mt-4 flex gap-2 border-t pt-3">
                                <button type="button"
                                        class="inline-flex h-8 cursor-pointer items-center rounded-md border px-3 text-xs font-medium transition-colors hover:bg-base-200">
                                    ♡ Нравится
                                </button>
                                <button type="button" w-on="click:focusReply"
                                        class="inline-flex h-8 cursor-pointer items-center rounded-md border px-3 text-xs font-medium transition-colors hover:bg-base-200">
                                    Ответить
                                </button>
                            </div>
                        </div>
                    </article>
                </div>
                <!-- Ответ -->
                <form w-on="submit:send" class="mt-6 rounded-xl border p-5 shadow-sm">
                    <h2 class="mb-3 text-sm font-semibold tracking-tight">Ваш ответ</h2>
                    <textarea id="reply" w-bind="draft" placeholder="Напишите сообщение…" aria-label="Текст ответа"
                              class="block min-h-24 w-full resize-y rounded-md border p-3 text-sm outline-none transition-colors focus-visible:ring-2 focus-visible:ring-base-content/30"></textarea>
                    <div class="mt-3 flex items-center justify-between gap-3">
                        <span class="text-xs text-base-content/60">{{ notice || data.replyHint }}</span>
                        <button type="submit"
                                class="inline-flex h-9 shrink-0 cursor-pointer items-center rounded-md bg-primary px-4 text-sm font-medium text-primary-content transition-opacity hover:opacity-90 focus-visible:ring-2 focus-visible:ring-base-content/30">
                            Опубликовать
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </template>
</body>
<footer>
    <script>
        $('#app')
            .state({
                dark: document.documentElement.classList.contains('dark'),
                loaded: false,
                error: false,
                query: '',
                page: 1,
                draft: '',
                notice: '',
                data: {topic: {pages: []}, posts: [], replyHint: ''}
            })
            .method('toggleTheme', function (state) {
                state.dark = !state.dark;
                document.documentElement.classList.toggle('dark', state.dark);
                try {
                    localStorage.setItem('neo-theme', state.dark ? 'dark' : 'light');
                } catch (e) {
                }
            })
            .method('setPage', function (state, p) {
                state.page = p;
            })
            .method('focusReply', function (state) {
                $('#reply').focus();
            })
            .method('send', function (state) {
                return function (e) {
                    e.preventDefault();
                    state.draft = '';
                    state.notice = 'Черновик очищен — подключите сервер для публикации.';
                };
            })
            .on('$mount', function (state) {
                $wire.get('./Topic.json').to(state.data)
                    .done(function () {
                        state.loaded = true;
                    })
                    .fail(function () {
                        state.error = true;
                    });
            })
            .mount();
    </script>
</footer>
</html>
